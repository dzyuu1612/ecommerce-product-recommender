<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kestrel — recommendation platform console</title>
  <meta name="description" content="Kestrel is the storefront and operations console for recsys-lite: browse a demo shop, then inspect the models, drift and event stream driving its recommendations." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5bd5'/%3E%3Cpath d='M10 7v18M10 16l9-9M13.5 12.5L21 25' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app" id="app">
    <div class="scrim" id="scrim" hidden></div>

    <aside class="sidebar" id="sidebar">
      <a class="sidebar-brand" href="#/" aria-label="Kestrel, home">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="currentColor"
               stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 7v18M10 16l9-9M13.5 12.5L21 25"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">Kestrel</span>
          <span class="brand-tag">recsys-lite console</span>
        </span>
      </a>

      <nav id="sidebar-nav" aria-label="Main"></nav>

      <div class="sidebar-footer">
        <label class="field-label" for="user-select">Browsing as</label>
        <select id="user-select" aria-label="Choose which shopper to browse as"></select>
      </div>
    </aside>

    <div>
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="nav-toggle" type="button"
                aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
        <span class="topbar-title" id="topbar-title">Kestrel</span>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark theme"></button>
        </div>
      </header>

      <main id="main" class="content" tabindex="-1">
        <div id="view" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
