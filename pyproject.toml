[project]
name = "recsys-lite"
version = "0.1.0"
description = "Self-contained e-commerce recommendation demo: synthetic data, a trained sequence ranking model, and a FastAPI serving layer."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "baoduynguyen1612", email = "baoduynguyen1612@gmail.com" },
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "torch>=2.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
